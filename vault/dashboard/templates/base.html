<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VAULT{% endblock %} — Storage Auction Intelligence</title>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #13131a;
            --border: #2a2a3a;
            --text: #e0e0e8;
            --text-muted: #8888a0;
            --accent: #6c5ce7;
            --accent-light: #a29bfe;
            --success: #00b894;
            --warning: #fdcb6e;
            --danger: #e17055;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        nav .brand {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-light);
            text-decoration: none;
            letter-spacing: 0.15em;
        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s;
        }

        nav a:hover, nav a.active { color: var(--accent-light); }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        h1, h2, h3 { color: var(--text); margin-bottom: 1rem; }
        h1 { font-size: 1.8rem; }
        h2 { font-size: 1.4rem; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--accent-light);
        }

        .stat-card .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .card h3 { font-size: 1.1rem; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th, td {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid var(--border);
        }

        th {
            color: var(--text-muted);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        td a { color: var(--accent-light); text-decoration: none; }
        td a:hover { text-decoration: underline; }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge-active { background: rgba(0,184,148,0.15); color: var(--success); }
        .badge-closed { background: rgba(225,112,85,0.15); color: var(--danger); }

        .bid { color: var(--success); font-weight: 600; }

        .pagination {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .pagination a, .pagination span {
            padding: 0.5rem 1rem;
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text-muted);
            text-decoration: none;
        }

        .pagination a:hover { border-color: var(--accent); color: var(--accent-light); }
        .pagination .current { background: var(--accent); color: #fff; border-color: var(--accent); }

        .btn {
            display: inline-block;
            padding: 0.6rem 1.2rem;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.85; }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.75rem;
            margin: 1rem 0;
        }

        .photo-grid img {
            width: 100%;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .feature-bar {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .feature-bar .name {
            min-width: 180px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .feature-bar .bar {
            flex: 1;
            height: 20px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .feature-bar .bar .fill {
            height: 100%;
            background: var(--accent);
            border-radius: 4px;
        }

        .feature-bar .val {
            min-width: 50px;
            text-align: right;
            font-size: 0.85rem;
        }

        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            margin: 1rem 0;
        }

        .upload-area input[type="file"] { margin: 1rem 0; }

        .result-box {
            background: rgba(108,92,231,0.1);
            border: 1px solid var(--accent);
            border-radius: 8px;
            padding: 1.5rem;
            margin: 1rem 0;
        }

        .error-box {
            background: rgba(225,112,85,0.1);
            border: 1px solid var(--danger);
            border-radius: 8px;
            padding: 1rem;
            color: var(--danger);
            margin: 1rem 0;
        }

        .tag {
            display: inline-block;
            padding: 0.15rem 0.5rem;
            background: rgba(108,92,231,0.15);
            color: var(--accent-light);
            border-radius: 4px;
            font-size: 0.8rem;
            margin: 0.15rem;
        }
    </style>
</head>
<body>
    <nav>
        <a href="/" class="brand">VAULT</a>
        <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Dashboard</a>
        <a href="/auctions" {% if '/auctions' in request.path %}class="active"{% endif %}>Auctions</a>
        <a href="/insights" {% if request.path == '/insights' %}class="active"{% endif %}>Insights</a>
        <a href="/score" {% if request.path == '/score' %}class="active"{% endif %}>Score Unit</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
